<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a private CampusCash student finance account." />
  <title>Create an account | CampusCash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="public-brand auth-brand" href="index.html"><img src="logo.jpg" alt="" /><span>Campus<span>Cash</span></span></a>
    <section class="auth-card">
      <a class="auth-back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
      <span class="public-eyebrow">Your money, made clearer</span>
      <h1>Create your account</h1>
      <p class="auth-intro">Start building a clearer picture of your campus finances.</p>
      <div id="authMessage" class="auth-message" role="status" aria-live="polite" hidden></div>
      <form data-auth-form="register" novalidate>
        <div class="auth-field"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" autocomplete="name" required minlength="2" maxlength="120" placeholder="Your full name" /></div>
        <div class="auth-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@university.ac.ke" /></div>
        <div class="auth-field"><label for="password">Password</label><div class="password-input"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" /><button type="button" data-toggle-password="password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div>
        <div class="auth-field"><label for="confirmPassword">Confirm password</label><div class="password-input"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Enter your password again" /><button type="button" data-toggle-password="confirmPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div>
        <button class="public-button auth-submit" type="submit">Create account <i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
    <p class="auth-privacy"><i class="fa-solid fa-shield-halved"></i> Your account and financial records are private.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
